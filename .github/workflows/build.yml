name: Build Mobile Apps (APK & IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Android APK Derleme
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HerSeySensin-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 2. iOS IPA Derleme (SPM & Xcode Uyumlu)
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin
          npx cap sync ios

      - name: Build Unsigned IPA (Scarlet Uyumlu)
        run: |
          cd ios/App
          BUILD_TARGET="-project App.xcodeproj"
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET="-workspace App.xcworkspace"
          fi

          xcodebuild clean build \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r HerSeySensin.ipa Payload
          mv HerSeySensin.ipa ../../

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HerSeySensin-iOS-IPA
          path: HerSeySensin.ipa